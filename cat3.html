<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мотивационное аудио с котиком</title>

    <style>
        @font-face {
            font-family: 'CarloMelowSans';
            font-style: italic;
            src: url(fonts/CarloMelowSans.woff2);
        }
        @font-face {
            font-family: 'CarloMelow';
            src: url(fonts/CarloMelow.woff2);
        }
        @font-face {
            font-family: 'TransformaMix';
            font-style: light;
            src: url(fonts/TransformaMixLight.woff2);
        }
        @font-face {
            font-family: 'TransformaMix';
            font-style: regular;
            src: url(fonts/TransformaMixRegular.woff2);
        }

        /* ===== БАЗА + РОЗОВЫЙ ПРАЗДНИЧНЫЙ ФОН ===== */
        html, body {
            height: 100%;
        }

        body {
            font-family: 'CarloMelow';
            margin: 0;
            padding: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;

            color: #fff;
            position: relative;
            overflow-x: hidden;

            /* праздничный градиент */
            background: radial-gradient(circle at top, #ffb6c1 0%, #b8004a 55%, #2a0015 100%);
        }

        /* мягкие "огоньки" */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.35;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.25) 0 2px, transparent 3px),
                radial-gradient(circle at 30% 80%, rgba(255,255,255,0.20) 0 2px, transparent 3px),
                radial-gradient(circle at 70% 30%, rgba(255,255,255,0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 85% 75%, rgba(255,255,255,0.22) 0 2px, transparent 3px);
            filter: blur(0.2px);
        }

        /* сердечки-паттерн */
        body::after {
            content: "❤   ❤    ❤  ❤   ❤     ❤   ❤   ❤";
            position: fixed;
            left: -5%;
            right: -5%;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: pre;
            font-size: 34px;
            color: rgba(255, 255, 255, 0.08);
            transform: rotate(-12deg);
            pointer-events: none;
        }

        /* ===== КАРТОЧКА ===== */
        .container {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 34px 28px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
            text-align: center;
            max-width: 620px;
            width: 90%;
            margin: 20px;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.28);
            position: relative;
        }

        /* небольшая "бумажность"/сияние */
        .container::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: radial-gradient(circle at top, rgba(255,255,255,0.35), transparent 55%);
            pointer-events: none;
        }

        h1 {
            color: #ffe6ef;
            margin: 0 0 18px;
            font-family: 'CarloMelowSans';
            text-shadow: 0 2px 14px rgba(255, 105, 180, 0.35);
            letter-spacing: 0.5px;
        }

        p {
            color: rgba(255, 230, 239, 0.95);
            margin: 0 0 14px;
            font-size: 16px;
            line-height: 1.5;
        }

        /* ===== КНОПКА ===== */
       .motivation-btn {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.82));
    color: #d40055;
    border: none;

    /* было: padding: 14px 28px; */
    padding: 14px 52px 14px 28px; /* справа больше места под сердечко */

    font-size: 18px;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    margin: 18px 0 10px;
    box-shadow: 0 14px 26px rgba(0, 0, 0, 0.20);
    font-family: 'TransformaMix';
    font-style: regular;
    font-weight: 700;
    position: relative;
}

.motivation-btn::after {
    content: "❤";
    position: absolute;
    right: 18px;          /* чуть правее */
    top: 50%;
    transform: translateY(-50%);
    color: rgba(212, 0, 85, 0.55);
    font-size: 18px;
    pointer-events: none; /* чтобы не мешало клику */
}

        .motivation-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.24);
        }

        /* легкое "дыхание" кнопки */
        .motivation-btn {
            animation: btnPulse 2.4s infinite;
        }
        @keyframes btnPulse {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(-1px); }
            100% { transform: translateY(0); }
        }

        /* ===== АУДИО ===== */
        .audio-container {
            width: 100%;
            margin-top: 18px;
            display: none;
            animation: fadeIn 0.45s;
        }

        audio {
            width: 100%;
            outline: none;
            border-radius: 50px;
            box-shadow: 0 10px 22px rgba(0,0,0,0.18);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== КОТИК ===== */
        .cat {
            position: fixed;
            bottom: 18px;
            right: 18px;
            width: 150px;
            height: 150px;
            z-index: 10;
            cursor: pointer;
            background-image: url('images/kotikakula.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom right;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 14px 22px rgba(0,0,0,0.25));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }

        /* ===== ОБЛАЧКО КОТИКА ===== */
        .message {
            position: absolute;
            bottom: 180px;
            right: 10px;

            background: rgba(255,255,255,0.92);
            color: #b8004a;
            padding: 10px 14px;
            border-radius: 16px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.20);
            max-width: 170px;
            display: none;
            z-index: 20;
            font-size: 14px;
            border: 1px solid rgba(255, 182, 193, 0.7);
            backdrop-filter: blur(6px);
        }

        .message:after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 22px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: rgba(255,255,255,0.92) transparent;
        }

        /* ===== АДАПТАЦИЯ ДЛЯ ТЕЛЕФОНОВ ===== */
        @media (max-width: 450px) {
            .container {
                padding: 22px 18px;
            }

            h1 {
                font-size: 22px;
                font-family: 'CarloMelow';
            }

            p {
                font-size: 15px;
            }

            .motivation-btn {
                font-family: TransformaMix;
                font-style: regular;
                padding: 12px 22px;
                font-size: 16px;
            }

            .cat {
                width: 135px;
                height: 135px;
            }

            .message {
                bottom: 150px;
                max-width: 150px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>ВЫ ПОПАЛИ НА АУДИО-ПРИЯТНОСТЬ!</h1>
        <p>Тыкни на кнопку, чтобы послушать</p>

        <button class="motivation-btn" id="playBtn">Послушать приятность</button>

        <div class="audio-container" id="audioContainer">
            <audio controls id="motivationAudio">
                <source src="audio/audiom.m4a" type="audio/mpeg">
                Ваш браузер не поддерживает аудио элемент.
            </audio>
        </div>
    </div>

    <!-- Котик из локального файла -->
    <div class="cat" id="cat"></div>

    <div class="message" id="catMessage">Слушай внимательно! Мяу!</div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const audioContainer = document.getElementById('audioContainer');
        const motivationAudio = document.getElementById('motivationAudio');
        const cat = document.getElementById('cat');
        const catMessage = document.getElementById('catMessage');

        // Показать/скрыть аудио плеер
        playBtn.addEventListener('click', function() {
            if (audioContainer.style.display === 'block') {
                motivationAudio.pause();
                audioContainer.style.display = 'none';
                playBtn.textContent = 'Послушать мотивашку';
            } else {
                audioContainer.style.display = 'block';
                motivationAudio.play();
                playBtn.textContent = 'Скрыть аудио';
                showCatMessage();
            }
        });

        // Показать сообщение котика
        function showCatMessage() {
            const messages = [
                "Посылаю самые пушистые лучши счастья"
            ];

            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            catMessage.textContent = randomMessage;
            catMessage.style.display = 'block';

            setTimeout(() => {
                catMessage.style.display = 'none';
            }, 3000);
        }

        // Клик по котику
        cat.addEventListener('click', showCatMessage);
    </script>
</body>
</html>
